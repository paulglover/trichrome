[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trichrome"
version = "0.4.0"
description = "Merge red/green/blue-light RAW triplets into 16-bit linear DNGs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Paul Glover" }]
dependencies = [
    "numpy>=1.24",
    "rawpy",
    "tifffile",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
trichrome = "trichrome.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
